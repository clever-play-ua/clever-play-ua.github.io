<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clever Play UA</title>
<style>
  :root {
    --bg: #030406;
    --bg-top: #0a0e1a;
    --grid: rgba(120, 140, 190, 0.09);
    --glow: #2a5298;
    --glow-soft: rgba(42, 82, 152, 0.55);
    --line: #b9c6ff;
    --cell: 80px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .bg { position: fixed; inset: 0; overflow: hidden;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 55%, #000 100%); }

  /* медленно дрейфующая сетка */
  .grid { position: absolute; inset: -160px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    animation: drift 24s linear infinite;
    will-change: transform; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(calc(var(--cell) * -1), calc(var(--cell) * -1), 0); }
  }

  /* синее свечение снизу, «дышит» */
  .glow { position: absolute; left: 50%; bottom: -22vh; width: 90vw; height: 50vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 50% 60% at 50% 70%, var(--glow) 0%, var(--glow-soft) 30%, transparent 70%);
    filter: blur(24px);
    animation: breathe 9s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: .75; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.08, 1.12); }
  }

  /* виньетка по краям */
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(0,0,0,.85) 100%); }

  @media (prefers-reduced-motion: reduce) {
    .grid, .glow { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="vignette"></div>
  </div>
</body>
</html>
