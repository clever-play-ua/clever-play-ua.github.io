<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clever Play UA</title>
<meta name="description" content="Clever Play UA: a small community with a big heart. We translate and voice games in Ukrainian.">
<link rel="canonical" href="https://clever-play-ua.github.io/en/">
<link rel="alternate" hreflang="uk" href="https://clever-play-ua.github.io/">
<link rel="alternate" hreflang="en" href="https://clever-play-ua.github.io/en/">
<link rel="alternate" hreflang="x-default" href="https://clever-play-ua.github.io/">
<meta name="theme-color" content="#030406">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="stylesheet" href="../style.css">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Clever Play UA">
<meta property="og:title" content="Clever Play UA">
<meta property="og:description" content="A small community with a big heart. We translate and voice games in Ukrainian.">
<meta property="og:url" content="https://clever-play-ua.github.io/en/">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="uk_UA">
<meta name="twitter:card" content="summary">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://clever-play-ua.github.io/#org",
      "name": "Clever Play UA",
      "url": "https://clever-play-ua.github.io/",
      "sameAs": [
        "https://www.youtube.com/@clever_play_ua",
        "https://t.me/clever_play_ua",
        "https://www.instagram.com/clever_play_ua/"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://clever-play-ua.github.io/en/#site",
      "url": "https://clever-play-ua.github.io/en/",
      "name": "Clever Play UA",
      "inLanguage": "en",
      "publisher": { "@id": "https://clever-play-ua.github.io/#org" }
    }
  ]
}
</script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="vignette"></div>
  </div>

  <div class="bar">
    <select id="lang" class="ctl" aria-label="Language / Мова">
      <option value="../">Ukrainian (Українська)</option>
      <option value="./" selected>English (Англійська)</option>
    </select>
    <button id="theme" class="ctl" type="button" data-dark="Dark theme" data-light="Light theme">Light theme</button>
  </div>

  <main>
    <img class="logo" src="../logo.svg" alt="Clever Play UA" width="400" height="240">
    <h1 class="title">Clever Play UA</h1>
    <p class="tagline">A small community with a big heart <span aria-hidden="true">•</span> We translate and voice games in Ukrainian</p>
    <nav class="links" aria-label="Social media">
      <a href="https://www.youtube.com/@clever_play_ua" rel="me noopener" target="_blank">YouTube</a>
      <a href="https://t.me/clever_play_ua" rel="me noopener" target="_blank">Telegram</a>
      <a href="https://www.instagram.com/clever_play_ua/" rel="me noopener" target="_blank">Instagram</a>
    </nav>
  </main>
  <script src="../site.js" defer></script>
</body>
</html>
